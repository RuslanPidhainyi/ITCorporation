services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ITCorporationDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=ITCorporationDb;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
