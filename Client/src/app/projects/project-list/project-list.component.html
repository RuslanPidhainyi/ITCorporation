<h2 class="title">Project List</h2>

<div class="button-wrapper">
  <button class="add-btn" (click)="navigateToAdd()">➕ Add Project</button>
</div>

<div class="table-wrapper">
  <table class="project-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Project Name</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of projectService.projects()" (click)="navigateToDetails(project.Id)" style="cursor: pointer;">
        <td>{{ project.Id }}</td>
        <td>{{ project.Name }}</td>
        <td>
          <span class="status" [ngClass]="project.Status.toLowerCase()">
            {{ project.Status }}
          </span>
        </td>
        <td class="actions">
          <button class="edit-btn" (click)="editProject(project.Id); $event.stopPropagation()">✏️</button>
          <button class="delete-btn" (click)="deleteProject(project.Id); $event.stopPropagation()">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template [ngIf]="projectService.projects().length === 0">
    <p>No projects to display.</p>
  </ng-template>
</div>
