<div class="form-wrapper">
  <h2 class="title">✏️ Edit Project</h2>

  <form (ngSubmit)="updateProject()" class="project-form">
    <div class="form-group">
      <label for="name">Project Name:</label>
      <input type="text" id="name" [(ngModel)]="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select id="status" [(ngModel)]="status" name="status" required [ngClass]="status.toLowerCase()">
        <option value="ToDo">ToDo</option>
        <option value="InProgress">InProgress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <div class="button-wrapper">
      <button type="submit" class="add-btn">Update Project</button>
    </div>
  </form>
</div>
